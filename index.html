<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depseek Helper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .container {
      background: #fff;
      margin-top: 40px;
      padding: 32px 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .level-indicator {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: #0078d7;
      margin-bottom: 16px;
    }
    .context-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .context-section label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      text-align: center;
      width: 100%;
    }
    .context-section textarea {
      width: 100%;
      min-height: 60px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: vertical;
      font-size: 1rem;
      margin-bottom: 12px;
      max-width: 400px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .centered-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #0078d7;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      height: 40px;
      align-self: center;
      margin-bottom: 8px;
    }
    .centered-btn:hover {
      background: #005fa3;
    }
    .depseek-section {
      border-top: 1px solid #eee;
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .depseek-section label {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .depseek-section input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    .depseek-section button {
      margin-top: 8px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #0078d7;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .depseek-section button:hover {
      background: #005fa3;
    }
    .depseek-response {
      margin-top: 12px;
      background: #f1f1f1;
      border-radius: 6px;
      padding: 12px;
      min-height: 32px;
      font-size: 1rem;
      color: #333;
      text-align: center;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .small-context-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 16px;
    }
    .small-context-section textarea {
      width: 80%;
      min-height: 32px;
      max-width: 300px;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: vertical;
      font-size: 0.95rem;
      margin-bottom: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .small-btn {
      font-size: 0.95rem;
      padding: 7px 16px;
      height: 32px;
      margin-bottom: 6px;
    }
    .small-response {
      margin-top: 8px;
      background: #f5f5f5;
      border-radius: 6px;
      padding: 8px;
      min-height: 20px;
      font-size: 0.95rem;
      color: #444;
      text-align: center;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="level-indicator">Level: <span id="current-level">1</span></div>
    <div class="context-section">
      <label for="context">Gendalf</label>
      <textarea id="context" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askDepseek();}"></textarea>
      <button class="centered-btn" onclick="askDepseek()">Send</button>
    </div>
    <div class="depseek-response" id="depseek-response">Responses will appear here</div>
    <div class="small-context-section">
      <textarea id="small-context" placeholder="Enter password" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();checkPassword();}"></textarea>
      <button class="centered-btn small-btn" onclick="checkPassword()">Check Password</button>
      <div class="small-response" id="small-response"></div>
    </div>
  </div>
  <script>
    let currentLevel = 1;
    const passwords = {
      1: "FOOTBALL",
      2: "MILAN",
      3: "INTER",
      4: "ARSENAL",
      5: "CHELSEA",
      6: "MADRID",
      7: "MANCHESTER IS RED"
    };

    function checkPassword() {
      const password = document.getElementById('small-context').value.trim().toUpperCase();
      const responseDiv = document.getElementById('small-response');
      
      if (password === passwords[currentLevel]) {
        if (currentLevel < 7) {
          currentLevel++;
          document.getElementById('current-level').textContent = currentLevel;
          responseDiv.textContent = "Correct! Moving to level " + currentLevel;
          // Clear both text areas
          document.getElementById('context').value = '';
          document.getElementById('small-context').value = '';
          document.getElementById('depseek-response').textContent = 'Responses will appear here';
        } else {
          responseDiv.textContent = "Congratulations! You've completed all levels!";
          // Clear both text areas
          document.getElementById('context').value = '';
          document.getElementById('small-context').value = '';
          document.getElementById('depseek-response').textContent = 'Responses will appear here';
        }
      } else {
        responseDiv.textContent = "Incorrect password. Try again.";
      }
    }

    function askDepseek() {
      const context = document.getElementById('context').value;
      const responseDiv = document.getElementById('depseek-response');
      if (!context.trim()) {
        responseDiv.textContent = 'Please enter a question for Gendalf.';
        return;
      }
      
      // Show loading state
      responseDiv.textContent = 'Thinking...';
      
      // Make API call to backend
      fetch('https://gandalf-backend.onrender.com/ask', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          message: context,
          level: currentLevel
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          responseDiv.textContent = 'Error: ' + data.error;
        } else {
          responseDiv.textContent = data.response;
        }
      })
      .catch(error => {
        responseDiv.textContent = 'Error: Could not connect to the server.';
        console.error('Error:', error);
      });
    }
  </script>
</body>
</html>
